name: opencare-proof-kit-prod

services:
  caddy:
    image: caddy:2
    depends_on:
      opencare:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - app_internal
    restart: unless-stopped

  opencare:
    build: .
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      OPENCARE_ENV: production
      OPENCARE_DEMO_MODE: "false"
      OPENCARE_VAULT_SOURCE: demo
      OPENCARE_VAULT_FILE: ${OPENCARE_VAULT_FILE:-}
      OPENCARE_DATA_DIR: data
      OPENCARE_REPORTS_DIR: reports
      OPENCARE_PRODUCT_DB_PATH: /var/lib/opencare/product-core/database.sqlite3
      OPENCARE_SOURCE_DIR: /var/lib/opencare/product-core/sources
      OPENCARE_SESSION_DB_PATH: /run/opencare/sessions.sqlite3
      OPENCARE_PUBLIC_REGISTRATION: ${OPENCARE_PUBLIC_REGISTRATION:-false}
      OPENCARE_ALLOW_CLOUD_LLM: ${OPENCARE_ALLOW_CLOUD_LLM:-false}
      OPENCARE_AGENT_MODE: ${OPENCARE_AGENT_MODE:-demo}
      OPENCARE_AGENT_ALLOW_EXTERNAL_LLM: ${OPENCARE_AGENT_ALLOW_EXTERNAL_LLM:-false}
      OPENCARE_LLM_RESPONSES_URL: ${OPENCARE_LLM_RESPONSES_URL:-}
      OPENCARE_LLM_API_KEY: ${OPENCARE_LLM_API_KEY:-}
      OPENCARE_LLM_MODEL: ${OPENCARE_LLM_MODEL:-}
      OPENCARE_OPENROUTER_API_KEY: ${OPENCARE_OPENROUTER_API_KEY:-}
      OPENCARE_OPENROUTER_MODEL: ${OPENCARE_OPENROUTER_MODEL:-}
      OPENCARE_OLLAMA_ENDPOINT: ${OPENCARE_OLLAMA_ENDPOINT:-http://127.0.0.1:11434}
      OPENCARE_OLLAMA_MODEL: ${OPENCARE_OLLAMA_MODEL:-}
      OPENCARE_OLLAMA_TIMEOUT_SECONDS: ${OPENCARE_OLLAMA_TIMEOUT_SECONDS:-15.0}
      OPENCARE_OLLAMA_MAX_RESPONSE_BYTES: ${OPENCARE_OLLAMA_MAX_RESPONSE_BYTES:-1000000}
      OPENCARE_SECRET_KEY: ${OPENCARE_SECRET_KEY}
      OPENCARE_ACCESS_PASSWORD: ${OPENCARE_ACCESS_PASSWORD}
      OPENCARE_BOOTSTRAP_SECRET: ${OPENCARE_BOOTSTRAP_SECRET}
    volumes:
      - type: bind
        source: "${OPENCARE_PRODUCT_DATA_DIR:?OPENCARE_PRODUCT_DATA_DIR is required}"
        target: /var/lib/opencare/product-core
      - type: bind
        source: "${OPENCARE_BACKUP_DIR:?OPENCARE_BACKUP_DIR is required}"
        target: /var/backups/opencare
    tmpfs:
      - /run/opencare:mode=0700,uid=10001,gid=10001
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app_internal
      - provider_egress
    restart: unless-stopped

networks:
  edge:
  app_internal:
    internal: true
  provider_egress:

volumes:
  caddy_data:
  caddy_config:
