name: opencare-proof-kit-prod

services:
  caddy:
    image: caddy:2
    depends_on:
      opencare:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - app_internal
    restart: unless-stopped

  opencare:
    build: .
    environment:
      OPENCARE_ENV: production
      OPENCARE_DEMO_MODE: "false"
      OPENCARE_VAULT_SOURCE: local_file
      OPENCARE_VAULT_FILE: /vault/local-family-vault.json
      OPENCARE_DATA_DIR: data
      OPENCARE_REPORTS_DIR: reports
      OPENCARE_PRODUCT_DB_PATH: /var/lib/opencare/product-core/database.sqlite3
      OPENCARE_SOURCE_DIR: /var/lib/opencare/product-core/sources
      OPENCARE_SESSION_DB_PATH: /run/opencare/sessions.sqlite3
      OPENCARE_ALLOW_CLOUD_LLM: "false"
      OPENCARE_SECRET_KEY: ${OPENCARE_SECRET_KEY}
      OPENCARE_ACCESS_PASSWORD: ${OPENCARE_ACCESS_PASSWORD}
    volumes:
      - type: bind
        source: ${OPENCARE_LOCAL_VAULT_PATH}
        target: /vault/local-family-vault.json
        read_only: true
      - type: bind
        source: "${OPENCARE_PRODUCT_DATA_DIR:?OPENCARE_PRODUCT_DATA_DIR is required}"
        target: /var/lib/opencare/product-core
      - type: bind
        source: "${OPENCARE_BACKUP_DIR:?OPENCARE_BACKUP_DIR is required}"
        target: /var/backups/opencare
    tmpfs:
      - /run/opencare:mode=0700
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app_internal
    restart: unless-stopped

networks:
  edge:
  app_internal:
    internal: true

volumes:
  caddy_data:
  caddy_config:
