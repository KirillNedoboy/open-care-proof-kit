name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/python312.txt -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run lint
        run: python -m ruff check app tests evals

      - name: Run type checks
        run: python -m mypy app evals

      - name: Run evals
        run: python -m evals.runner

      - name: Run trust metrics
        run: python -m evals.trust_metrics

      - name: Run final phase reviewers
        run: |
          python -m evals.g5_review
          python -m evals.p1_review
          python -m evals.p2_review
          python -m evals.d1_review
          python -m evals.p3_review

      - name: Check dependencies and patch
        run: |
          python -m pip check
          git diff --check

      - name: Check runtime JavaScript
        run: |
          node --check app/static/product_core_workspace.js
          node --check app/static/genetics.js

  family-access-credentials:
    name: Family access credentials (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/python312.txt -e ".[dev]"

      - name: Verify scrypt credential behavior
        run: python -m pytest tests/test_family_access_security.py -q
